backend:
  name: github
  repo: mstfavelibeyoglu/cerrahpasa-tanitim
  branch: main
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # DUYURULAR
  - name: "announcements"
    label: "📢 Duyurular"
    folder: "data/announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Başlık", name: "title", widget: "string", required: true}
      - {label: "Kısa Açıklama", name: "description", widget: "text", required: true}
      - {label: "Detaylı Açıklama", name: "longDescription", widget: "markdown", required: true}
      - {label: "Tarih", name: "date", widget: "string", pattern: ["^\\d{1,2} \\w+ \\d{4}$", "Tarih formatı: 24 Nisan 2026"], required: true}
      - {label: "Yeni Mi?", name: "isNew", widget: "boolean", default: false}

  # SIKÇA SORULAN SORULAR
  - name: "faqs"
    label: "❓ Sık Sorulan Sorular"
    folder: "data/faqs"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Soru", name: "question", widget: "string", required: true}
      - {label: "Cevap", name: "answer", widget: "markdown", required: true}

  # İLETİŞİM BİLGİLERİ
  - name: "contact"
    label: "📞 İletişim Bilgileri"
    files:
      - name: "main"
        label: "İletişim Sayfası"
        file: "data/contact.json"
        fields:
          - {label: "E-posta", name: "email", widget: "string"}
          - {label: "Instagram (1)", name: "instagram1", widget: "string"}
          - {label: "Instagram (2)", name: "instagram2", widget: "string"}
          - {label: "Adres", name: "address", widget: "text"}
